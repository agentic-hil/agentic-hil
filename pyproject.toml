[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-hil"
version = "0.21.1"
description = "A green build is not enough: Agentic HIL lets an AI agent probe, flash, reset and exchange UART and CAN traffic with a real STM32 or other embedded target, through policy-gated MCP tools instead of a raw debugger shell, so hardware-in-the-loop tests run unattended in CI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Hannes Pauli", email = "mail@hannes-pauli.de" }
]
keywords = [
  "mcp",
  "model-context-protocol",
  "embedded",
  "hardware-in-the-loop",
  "openocd",
  "firmware",
  "serial",
  "stlink",
  "debugger",
  "agentic-hil",
  "agentic",
  "agentic_hil",
  "stm32",
  "mcp-server",
  "uart",
  "can",
  "can-bus",
  "pyocd",
  "pytest",
  "hardware-testing",
  "firmware-testing"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Testing"
]
dependencies = [
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "pyserial>=3.5",
  "tomli>=2; python_version < '3.11'"
]

[project.optional-dependencies]
can = ["python-can>=4.4"]
pyocd = ["pyocd>=0.36"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  # Deliberately not in addopts below: a bare `pytest` stays one process, and
  # `pytest -n auto` is the parallel invocation, which CONTRIBUTING.md documents.
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "twine>=5.0"
]

[project.urls]
Homepage = "https://github.com/agentic-hil/agentic-hil"
Documentation = "https://agentic-hil.readthedocs.io/"
Repository = "https://github.com/agentic-hil/agentic-hil.git"
Changelog = "https://github.com/agentic-hil/agentic-hil/blob/master/CHANGELOG.md"
Issues = "https://github.com/agentic-hil/agentic-hil/issues"

[project.scripts]
agentic-hil = "agentic_hil.cli:entrypoint"

[project.entry-points.pytest11]
agentic_hil = "agentic_hil.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_hil = [
  "schemas/*.json",
  "templates/*.json",
  "skills/agentic-hil/SKILL.md"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The evaluation harness under evals/ is not a package that gets installed, so
# the repository root has to be importable. "python -m pytest" adds it, a bare
# "pytest" does not, which is how CI collected zero evaluation tests.
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
