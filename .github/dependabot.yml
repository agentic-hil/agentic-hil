version: 2
updates:
  # This entry covers pyproject.toml and the lock files under requirements/.
  # The pip ecosystem already looks into a requirements/ subdirectory from the
  # configured directory, so a second entry pointing at "/requirements" does not
  # add coverage - it produces a duplicate pull request against the same file
  # for every update, which is what it did.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # wrapt is not a dependency this project declares. It arrives through
    # python-can, which requires wrapt~=1.10, so anything from 2.0 up cannot
    # resolve. python-can 4.6.1 is the newest release and predates wrapt 2.0.0
    # by two months, so there is no version to move to; the ceiling is upstream,
    # not here. Mirror that ceiling instead of reopening the same unmergeable
    # pull request every month, and keep 1.x patches flowing. Drop this once
    # python-can ships a release that accepts wrapt 2.
    ignore:
      - dependency-name: "wrapt"
        update-types:
          - version-update:semver-major
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The eval container's base image is pinned by digest. Without this entry the
  # digest never moves, and a pin that never moves is a stale, vulnerable image
  # rather than a safe one.
  #
  # What this entry is for is digest freshness inside node:22, not moving to a
  # new Node. The image is the runtime underneath the three agent CLIs the eval
  # measures, so changing its major changes what the measurement means, and the
  # first proposal this entry produced was a jump to node:25 - an odd-numbered
  # line that never becomes LTS. Major bumps are a deliberate decision, made the
  # same way the CLI pins are.
  - package-ecosystem: docker
    directory: "/evals/install/container"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
    groups:
      eval-container:
        patterns:
          - "*"

  # The TLS-proxy eval's base image is pinned by digest for the same reason, and
  # needs an entry of its own: the docker ecosystem reads the Dockerfile in the
  # directory it is given and nothing below it, so the entry above says nothing
  # about this one. That eval is a bench a reader is invited to build and run
  # themselves, which makes a digest that never moves worse here than anywhere.
  #
  # No major ignore. debian:bookworm-slim names the Debian release in the tag,
  # so moving to the next one is a tag change nobody's bot can propose, and
  # every digest move inside bookworm is exactly the security refresh this entry
  # exists for.
  - package-ecosystem: docker
    directory: "/evals/tls_proxy/container"
    schedule:
      interval: weekly
      day: monday
      time: "06:50"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      tls-proxy-eval-container:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
