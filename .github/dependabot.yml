version: 2
updates:
  # The uv ecosystem, not pip, for the locks under requirements/. Every file
  # there is a `uv pip compile --universal --generate-hashes` lock, and the
  # pip ecosystem regenerated the ones with a .in input through pip-compile:
  # one interpreter, one platform, the markers that carry the Windows and
  # macOS packages gone and the entries the other interpreters need with them.
  # The uv ecosystem reruns `uv pip compile` itself, with --universal,
  # --generate-hashes and --python-version read off each lock, so what it
  # writes is what the recorded command writes. dev.txt is compiled from
  # pyproject.toml rather than a .in file and is edited pin by pin instead;
  # the "Lock files match their inputs" job in ci.yml recompiles every lock
  # on every pull request and names the pin that does not follow.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Two ceilings set upstream, mirrored here so the bot does not propose what
    # cannot resolve, month after month. A pin edited one at a time crosses a
    # ceiling nothing checks; these two have.
    #
    # wrapt arrives through python-can, which requires wrapt~=1.10, so anything
    # from 2.0 up cannot resolve. python-can 4.6.1 is the newest release and
    # predates wrapt 2.0.0 by two months; the ceiling is upstream, not here.
    # Drop this once python-can ships a release that accepts wrapt 2.
    #
    # pylink-square arrives through pyocd, which requires pylink-square<2.0,
    # and the pin that crossed that ceiling is what left every hash-pinned
    # install in the matrix with ResolutionImpossible. Drop this once pyocd
    # ships a release that accepts pylink-square 2.
    ignore:
      - dependency-name: "wrapt"
        update-types:
          - version-update:semver-major
      - dependency-name: "pylink-square"
        update-types:
          - version-update:semver-major
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The eval container's base image is pinned by digest. Without this entry the
  # digest never moves, and a pin that never moves is a stale, vulnerable image
  # rather than a safe one.
  #
  # What this entry is for is digest freshness inside node:22, not moving to a
  # new Node. The image is the runtime underneath the three agent CLIs the eval
  # measures, so changing its major changes what the measurement means, and the
  # first proposal this entry produced was a jump to node:25 - an odd-numbered
  # line that never becomes LTS. Major bumps are a deliberate decision, made the
  # same way the CLI pins are.
  - package-ecosystem: docker
    directory: "/evals/install/container"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
    groups:
      eval-container:
        patterns:
          - "*"

  # The TLS-proxy eval's base image is pinned by digest for the same reason, and
  # needs an entry of its own: the docker ecosystem reads the Dockerfile in the
  # directory it is given and nothing below it, so the entry above says nothing
  # about this one. That eval is a bench a reader is invited to build and run
  # themselves, which makes a digest that never moves worse here than anywhere.
  #
  # No major ignore. debian:bookworm-slim names the Debian release in the tag,
  # so moving to the next one is a tag change nobody's bot can propose, and
  # every digest move inside bookworm is exactly the security refresh this entry
  # exists for.
  - package-ecosystem: docker
    directory: "/evals/tls_proxy/container"
    schedule:
      interval: weekly
      day: monday
      time: "06:50"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      tls-proxy-eval-container:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
