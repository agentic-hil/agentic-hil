version: 2
updates:
  # No pip entry, on purpose. Every file under requirements/ is a `uv pip
  # compile --universal --generate-hashes` lock, and Dependabot cannot update
  # one: it moves pins one at a time and, where it re-resolves a file, does so
  # for one interpreter on one platform, which twice produced a lock no runner
  # could install (a pylink-square past the ceiling pyocd sets, the Windows
  # and macOS markers gone). The weekly refresh is .github/workflows/
  # lock-refresh.yml, which runs the command each lock records with --upgrade
  # and opens the pull request itself, and the "Lock files match their inputs"
  # job in ci.yml holds every other change to those files to the same rule.
  # The wrapt ceiling the pip entry mirrored (python-can requires wrapt~=1.10)
  # needs no mirror now: uv resolves the whole set, so it never proposes what
  # cannot resolve.

  # The eval container's base image is pinned by digest. Without this entry the
  # digest never moves, and a pin that never moves is a stale, vulnerable image
  # rather than a safe one.
  #
  # What this entry is for is digest freshness inside node:22, not moving to a
  # new Node. The image is the runtime underneath the three agent CLIs the eval
  # measures, so changing its major changes what the measurement means, and the
  # first proposal this entry produced was a jump to node:25 - an odd-numbered
  # line that never becomes LTS. Major bumps are a deliberate decision, made the
  # same way the CLI pins are.
  - package-ecosystem: docker
    directory: "/evals/install/container"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
    groups:
      eval-container:
        patterns:
          - "*"

  # The TLS-proxy eval's base image is pinned by digest for the same reason, and
  # needs an entry of its own: the docker ecosystem reads the Dockerfile in the
  # directory it is given and nothing below it, so the entry above says nothing
  # about this one. That eval is a bench a reader is invited to build and run
  # themselves, which makes a digest that never moves worse here than anywhere.
  #
  # No major ignore. debian:bookworm-slim names the Debian release in the tag,
  # so moving to the next one is a tag change nobody's bot can propose, and
  # every digest move inside bookworm is exactly the security refresh this entry
  # exists for.
  - package-ecosystem: docker
    directory: "/evals/tls_proxy/container"
    schedule:
      interval: weekly
      day: monday
      time: "06:50"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      tls-proxy-eval-container:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
