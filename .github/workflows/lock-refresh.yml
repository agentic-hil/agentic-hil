# The weekly dependency refresh: the one thing that rewrites the lock files.
#
# Every file under requirements/ is a `uv pip compile --universal
# --generate-hashes` lock, and the only way to update one is to run the command
# on its second line again. Dependabot did not: it moved pins one at a time, and
# where it re-resolved a file it did so for one interpreter on one platform.
# Twice that produced a lock no runner could install, the second time with
# pylink-square moved past the ceiling pyocd sets and the markers that carry
# colorama, pywin32-ctypes and hidapi to Windows and macOS gone. So the pip
# entry is out of .github/dependabot.yml, and this job runs
# tools/refresh_locks.py instead, which moves each exact pin in the .in inputs
# to its newest release and then runs every recorded command with --upgrade.
# The result is one pull request a week, the same as before, resolved by the
# tool that wrote the locks. The "Lock files match their inputs" job in ci.yml
# is what holds every other change to those files to the same rule.
#
# The pull request is opened with the workflow's own token, and a token like
# that starts no other workflow on its own: without more, the pull request would
# sit there with no checks. workflow_dispatch is the documented exception, so
# the last step starts `Python CI` and `Dependency Review` on the branch itself;
# their check runs land on the commit the pull request points at, which is
# where the required checks are read from. Opening the pull request at all
# needs one repository setting, "Allow GitHub Actions to create and approve
# pull requests" under Settings, Actions, General; with it off, `gh pr create`
# fails naming exactly that, after the branch has been pushed.
#
# uv is installed by the hashes requirements/container.txt carries for it, the
# way every other package a workflow here installs is. That lock is where uv is
# pinned on purpose, so a refresh is made by the uv release the container tier
# has already run, and the bump of that pin arrives through the same pull
# request as everything else, with the container tier behind it.
name: Dependency lock refresh

on:
  workflow_dispatch:
  schedule:
    # 05:23 UTC on Mondays, the slot the Dependabot entry used to hold. An odd
    # minute rather than the top of an hour, which is when every scheduled
    # workflow on the service asks at once and the queue is longest.
    - cron: "23 5 * * 1"

permissions:
  contents: read

# One refresh at a time; a second one started by hand waits for the first.
concurrency:
  group: lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the lock files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv by the hashes the container lock carries
        run: |
          python tools/refresh_locks.py --uv-requirement > uv-requirement.txt
          python -m pip install --require-hashes -r uv-requirement.txt

      - name: Refresh every lock from its recorded command
        run: python tools/refresh_locks.py --summary lock-refresh-summary.md

      # One branch, force-pushed: a refresh nobody merged is replaced by the
      # next one rather than joined by it, and the open pull request follows
      # the branch. The commit is made by the Actions bot under its own
      # account, so the ruleset's attribution check has an author to read.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: deps/lock-refresh
          TITLE: "build(deps): refresh the hash-pinned locks"
        run: |
          set -euo pipefail
          if git diff --quiet -- requirements/; then
            echo "Every lock is current; nothing to open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add requirements/
          { echo "$TITLE"; echo; cat lock-refresh-summary.md; } | git commit --quiet --file -
          git push --force origin "$BRANCH"
          if [[ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" == "0" ]]; then
            gh pr create --base master --head "$BRANCH" --title "$TITLE" --body-file lock-refresh-summary.md
          else
            gh pr edit "$BRANCH" --title "$TITLE" --body-file lock-refresh-summary.md
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run dependency-review.yml --ref "$BRANCH"
