# Generated by the hil-validations bench gate for one bench run; do not edit.
#
# This branch's version of the bench workflow runs the validation images in
# examples/nucleo-f446re_demo/hilval/smoke, one plan per image, and then the
# demo's own plan, which puts the demo firmware back on the board. It runs only
# when started by hand with this branch as the ref: it has no schedule and no
# pull request trigger, and a schedule only ever runs the default branch's
# version, so the nightly is unchanged.
#
# The images were built elsewhere and are committed as built; this job builds
# nothing but the demo, installs nothing and writes no configuration. Every
# hardware action is an Agentic HIL command: `agentic-hil test-reactor` flashes,
# resets and reads the serial port, and `agentic-hil run-evidence` writes the
# evidence that is uploaded.
name: Hardware bench

on:
  workflow_dispatch:

permissions:
  contents: read

# The default branch's group, so a run of this branch waits for the nightly and
# the nightly for it. Never `cancel-in-progress: true`: cancelling a run in the
# middle of a plan is how a board is left half flashed.
concurrency:
  group: nucleo-f446re-bench
  cancel-in-progress: false

jobs:
  bench:
    name: Run the hilval smoke images on the Nucleo-F446RE
    if: github.repository == 'agentic-hil/agentic-hil'
    runs-on: [self-hosted, agentic-hil, nucleo-f446re]
    timeout-minutes: 47

    defaults:
      run:
        working-directory: examples/nucleo-f446re_demo

    steps:
      - name: Check out the commit this run is about
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Say which Agentic HIL the bench is running
        run: agentic-hil --version

      - name: Take the machine's run lock
        working-directory: .
        timeout-minutes: 240
        run: exec python3 tools/run_lock.py take --state "$RUNNER_TEMP/run-lock.json" --tool .github/workflows/hardware-bench.yml --runs-for "up to 47 minutes" --for-the-life-of "$PPID"

      # Printed through tools/withhold.py because this log is public and doctor
      # names the probe by its serial number.
      - name: Report the bench this job is about to drive
        run: python3 ../../tools/withhold.py run -- agentic-hil doctor

      # Built before any plan reaches the board, so the step that puts the demo
      # back below has its image whatever the plans do.
      - name: Build the demo firmware for the board
        id: build
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

      # Copied into build/, inside the artifact roots the bench's configuration
      # allows, and checked against their committed SHA-256 sums before any plan
      # flashes one.
      - name: Stage the validation images
        id: stage
        shell: bash
        run: |
          mkdir -p build/hilval-smoke
          cp hilval/smoke/images/*.elf build/hilval-smoke/
          cd build/hilval-smoke
          sha256sum --strict -c ../../hilval/smoke/images/SHA256SUMS

      # One plan per image, each report captured from `--json` into its own
      # file. A red plan does not stop the next one: each image is its own
      # claim. A plan that fails waits before it returns, so an image that
      # misbehaved after its reset has settled before the next plan flashes.
      - name: Run image basic
        id: image_1
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/basic.json -- agentic-hil test-reactor --test-config hilval/smoke/plans/basic.testconfig.yaml --json || { rc=$?; sleep 15; exit $rc; }

      - name: Run image echo
        id: image_2
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 7
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/echo.json -- agentic-hil test-reactor --test-config hilval/smoke/plans/echo.testconfig.yaml --json || { rc=$?; sleep 15; exit $rc; }

      - name: Run image afin
        id: image_3
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/afin.json -- agentic-hil test-reactor --test-config hilval/smoke/plans/afin.testconfig.yaml --json || { rc=$?; sleep 15; exit $rc; }

      - name: Run image analog
        id: image_4
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/analog.json -- agentic-hil test-reactor --test-config hilval/smoke/plans/analog.testconfig.yaml --json || { rc=$?; sleep 15; exit $rc; }
      # Whatever the plans did: the default branch's nightly and every other
      # run on this bench expect the demo on the board.
      - name: Put the demo firmware back on the board
        id: demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/demo.json -- agentic-hil test-reactor --test-config testconfig.yaml --json

      - name: Give the machine's run lock back
        if: always()
        working-directory: .
        run: python3 tools/run_lock.py give-back --state "$RUNNER_TEMP/run-lock.json"

      # One evidence directory per report, whatever that run did. A report that
      # is missing fails this step after the others have been collected.
      - name: Collect the evidence for each run
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for run in basic echo afin analog demo; do
            if [ -s "artifacts/reports/$run.json" ]; then
              python3 ../../tools/withhold.py run -- agentic-hil run-evidence --report "artifacts/reports/$run.json" --out "artifacts/evidence/$run" || status=1
            else
              echo "::error::No report for $run"
              status=1
            fi
          done
          exit "$status"

      - name: Withhold what names the bench from the evidence
        id: withhold
        if: always()
        run: python3 ../../tools/withhold.py files artifacts .agentic-hil/reports .agentic-hil/logs

      - name: Upload the run evidence
        if: ${{ always() && steps.withhold.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hilval-smoke-evidence
          path: examples/nucleo-f446re_demo/artifacts/
          if-no-files-found: error
          retention-days: 14
