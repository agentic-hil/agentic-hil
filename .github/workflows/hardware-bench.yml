# This project's own bench, on a schedule and on request, and never on a pull
# request.
#
# This branch's version runs one validation instead of the demo:
# examples/nucleo-f446re_demo/zephyr-120620, the three plans for
# zephyrproject-rtos/zephyr#120620, one after another, and then the demo's own
# plan, which puts the demo firmware back on the board. It runs when a
# maintainer starts it by hand with this branch as the ref; a schedule only
# ever runs the default branch's version, so the nightly is unchanged.
#
# There is deliberately no `pull_request` trigger, and adding one would open the
# hole this file exists to keep shut. A self-hosted runner executes whatever the
# checked-out branch says, on a machine with a board wired to it, so a workflow
# that ran on a fork's pull request would hand a stranger's code that machine.
#
# The runner is addressed by its labels and by nothing else. No host name, no
# user, no path and no network address belongs in this file: `self-hosted` says
# the machine is not a hosted runner, `agentic-hil` says it is a bench, and
# `nucleo-f446re` says which board it holds, so a plan written for that board
# never lands on a bench beside it.
#
# What the operator sets up once, outside this repository, is docs/ci-examples.md
# under "What the runner has to provide". This job installs nothing, upgrades
# nothing and writes no configuration.
name: Hardware bench

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# The default branch's group, so a run of this branch waits for the nightly and
# the nightly for it. Never `cancel-in-progress: true`: cancelling a run in the
# middle of a plan is how a board is left half flashed.
concurrency:
  group: nucleo-f446re-bench
  cancel-in-progress: false

jobs:
  bench:
    name: Validate zephyrproject-rtos/zephyr#120620 on the Nucleo-F446RE
    if: github.repository == 'agentic-hil/agentic-hil'
    runs-on: [self-hosted, agentic-hil, nucleo-f446re]
    timeout-minutes: 260

    defaults:
      run:
        working-directory: examples/nucleo-f446re_demo

    steps:
      - name: Check out the commit this run is about
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Say which Agentic HIL the bench is running
        run: agentic-hil --version

      # The machine's run lock, as on the default branch. The three plans and
      # the demo hold the board for a few minutes, which is what a run queued
      # behind this one is told.
      - name: Take the machine's run lock
        working-directory: .
        timeout-minutes: 240
        run: exec python3 tools/run_lock.py take --state "$RUNNER_TEMP/run-lock.json" --tool .github/workflows/hardware-bench.yml --runs-for "about five minutes" --for-the-life-of "$PPID"

      # Doctor first, before a plan gets near the board, printed through
      # tools/withhold.py because this log is public and doctor names the probe
      # by its serial number.
      - name: Report the bench this job is about to drive
        run: python3 ../../tools/withhold.py run -- agentic-hil doctor

      # Built before any plan reaches the board, so the step that puts the demo
      # back below has its image whatever the plans do.
      - name: Build the demo firmware for the board
        id: build
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

      # The validation images are committed as built, beside their plans, and
      # are not built here. They are copied into build/, inside the artifact
      # roots the bench's configuration allows, and checked against their
      # committed SHA-256 sums before any plan flashes one.
      - name: Stage the validation images
        id: stage
        shell: bash
        run: |
          mkdir -p build/zephyr-120620
          cp zephyr-120620/firmware/*.elf build/zephyr-120620/
          cd build/zephyr-120620
          sha256sum --strict -c ../../zephyr-120620/firmware/SHA256SUMS

      # One plan per image, each report captured from `--json` into its own
      # file, which is what the evidence step reads. A plan that fails waits
      # thirty seconds before it returns, so an image that was reset but never
      # got as far as its answers has finished its Stop mode cycles, during
      # which the probe cannot reach the core, before the next plan flashes. A
      # red plan does not stop the next one: each image is its own claim.
      - name: Run the pull request at 180 MHz
        id: pr_180
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/pr-180.json -- agentic-hil test-reactor --test-config zephyr-120620/plans/pr-180.testconfig.yaml --json || { rc=$?; sleep 30; exit $rc; }

      - name: Run the pull request at 168 MHz (control)
        id: pr_168
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/pr-168.json -- agentic-hil test-reactor --test-config zephyr-120620/plans/pr-168.testconfig.yaml --json || { rc=$?; sleep 30; exit $rc; }

      - name: Run the pull request's base at 168 MHz (control)
        id: base_168
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/base-168.json -- agentic-hil test-reactor --test-config zephyr-120620/plans/base-168.testconfig.yaml --json || { rc=$?; sleep 30; exit $rc; }

      # Whatever the plans did: the default branch's nightly and every other
      # run on this bench expect the demo on the board.
      - name: Put the demo firmware back on the board
        id: demo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/demo.json -- agentic-hil test-reactor --test-config testconfig.yaml --json

      - name: Give the machine's run lock back
        if: always()
        working-directory: .
        run: python3 tools/run_lock.py give-back --state "$RUNNER_TEMP/run-lock.json"

      # One evidence directory per report, each built from the report its step
      # captured, whatever that run did. Each call appends its job summary to
      # `$GITHUB_STEP_SUMMARY` itself. A report that is missing fails this step
      # after the others have been collected.
      - name: Collect the evidence for each run
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for run in pr-180 pr-168 base-168 demo; do
            if [ -s "artifacts/reports/$run.json" ]; then
              python3 ../../tools/withhold.py run -- agentic-hil run-evidence --report "artifacts/reports/$run.json" --out "artifacts/evidence/$run" || status=1
            else
              echo "::error::No report for $run"
              status=1
            fi
          done
          exit "$status"

      - name: Withhold what names the bench from the evidence
        id: withhold
        if: always()
        run: python3 ../../tools/withhold.py files artifacts .agentic-hil/reports .agentic-hil/logs

      # These are the workspace mirrors. The canonical, hash-chained copies stay
      # under the configuration's `state_root` on the bench and are never
      # uploaded.
      - name: Upload the run evidence
        if: ${{ always() && steps.withhold.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zephyr-120620-f446re-evidence
          path: |
            examples/nucleo-f446re_demo/artifacts/
            examples/nucleo-f446re_demo/.agentic-hil/reports/
            examples/nucleo-f446re_demo/.agentic-hil/logs/
          if-no-files-found: warn
          retention-days: 14
