# This project's own bench, on a schedule and on request, and never on a pull
# request.
#
# There is deliberately no `pull_request` trigger, and adding one would open the
# hole this file exists to keep shut. A self-hosted runner executes whatever the
# checked-out branch says, on a machine with a board wired to it, so a workflow
# that ran on a fork's pull request would hand a stranger's code that machine.
# A change reaches this bench by being merged first, where a human has looked at
# it, and then by the nightly schedule or by a maintainer starting the workflow
# by hand. `push` is left out for the same reason it is left out of the starter's
# hardware workflow: a bench is one board and a queue, not a per-commit gate.
# .github/workflows/ci.yml is the gate; this is the nightly proof on real
# hardware.
#
# The runner is addressed by its labels and by nothing else. No host name, no
# user, no path and no network address belongs in this file: `self-hosted` says
# the machine is not a hosted runner, `agentic-hil` says it is a bench, and
# `nucleo-f446re` says which board it holds, so a plan written for that board
# never lands on a bench beside it.
#
# What the operator sets up once, outside this repository, is docs/ci-examples.md
# under "What the runner has to provide": the board and the operating-system
# rights to open its probe and its serial port, the debugger and build
# toolchains, and Agentic HIL on the runner's PATH. This job installs nothing,
# upgrades nothing and writes no configuration. A workflow that could write the
# file that says what the machine may do would be the hole the whole safety
# model is built around.
name: Hardware bench

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC, nightly. An odd minute rather than the top of an hour, which is
    # when every scheduled workflow on the service asks at once and the queue is
    # longest.
    - cron: "17 3 * * *"

permissions:
  contents: read

# One bench, one run at a time. A GitHub concurrency group only coordinates runs
# within one repository, so this group is *not* what serialises this workflow
# against the STM32 starter's: two repositories that name the same string get two
# independent groups, and neither waits on the other. What actually serialises
# the two repositories is the bench itself. One board is wired to one machine,
# one self-hosted runner is registered on it with these labels, and a runner runs
# one job at a time, so a run from either repository sits in that single runner's
# own queue while the other holds the board. The machine-wide device locks are
# the backstop under that: a run that somehow reached the board while another
# held it is refused with `device_busy` naming the holder rather than meeting it
# on the probe.
#
# This group's job is narrower, and real: it keeps this repository's own runs
# from piling up on that queue, a manual dispatch started while the nightly is
# still on the board, or two dispatches in a row, by letting the newer run wait
# for the older instead of both queuing. Never `cancel-in-progress: true`:
# cancelling a run in the middle of a plan is how a board is left half flashed.
concurrency:
  group: nucleo-f446re-bench
  cancel-in-progress: false

jobs:
  bench:
    name: Run the Nucleo-F446RE demo on the bench
    # A fork inherits this file and its schedule. Without this, a fork's nightly
    # run would queue forever against labels it has no runner for, and its owner
    # would be reading a stuck job that was never theirs to run.
    if: github.repository == 'agentic-hil/agentic-hil'
    runs-on: [self-hosted, agentic-hil, nucleo-f446re]
    # Twenty minutes for the work, as before the job queued for the machine, on
    # top of the wait's own limit on the step that takes the run lock: a wait
    # counted against the work would stop a late plan half way through a flash.
    timeout-minutes: 260

    # Every `run:` step below is about the demo, so the demo directory is the
    # working directory rather than a `cd` repeated in each step. This reaches
    # `run:` steps only, which is why the upload paths at the end are spelled
    # from the workspace root. The two steps about the machine's run lock say
    # where they run themselves.
    defaults:
      run:
        working-directory: examples/nucleo-f446re_demo

    steps:
      - name: Check out the commit this run is about
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The bench's own installation answers here, and this job neither installs
      # it nor moves it: a bench may be deliberately offline, and an installation
      # a workflow could replace is an installation nobody pinned. The number is
      # printed so a report can be placed against the release that produced it.
      - name: Say which Agentic HIL the bench is running
        run: agentic-hil --version

      # The machine's run lock, the one every container runner on it queues on
      # before it builds anything: tools/bench_in_container.py, the gate's own
      # command, and tools/ci_linux.py and tools/loop_in_container.py beside it.
      # The concurrency group above only orders this workflow against the gate
      # on GitHub's side, so without the lock a tier started on the machine
      # itself would meet this job as `device_busy` in the middle of a plan, and
      # this job would meet the tier the same way. Taken before doctor, which is
      # the first step that reaches the probe, and queued behind whoever holds
      # it rather than refused.
      #
      # `exec`, so the command is the step's own process and `$PPID` is the job's
      # process, which lives until the job ends: the lock is held for the job's
      # life, not the step's, and a job that ends without the step that gives it
      # back leaves a record naming a process that is gone, which the next run
      # breaks as stale. Its lines withhold the machine's names, as the tier's
      # runner does in the gate's log.
      #
      # Four hours to wait, then this step fails without anything having reached
      # the board. A tier holds the machine for ten to thirty minutes and the
      # Linux suite for seven; a review loop holds it for hours, and a nightly
      # that waits one out still proves the night's commit that morning. This
      # job's own steps on the board took under half a minute on every night of
      # the two weeks before the lock, which is what a run queued behind it is
      # told.
      - name: Take the machine's run lock
        working-directory: .
        timeout-minutes: 240
        run: exec python3 tools/run_lock.py take --state "$RUNNER_TEMP/run-lock.json" --tool .github/workflows/hardware-bench.yml --runs-for "under a minute" --for-the-life-of "$PPID"

      # Doctor first, before a plan gets near the board: it resolves the
      # authoritative configuration for this directory, names the probe and the
      # port it bound, and spawns the debugger toolchain, so a missing toolchain
      # or an unreadable bench fails here instead of half way through a plan.
      #
      # That configuration is created once, by hand, with `agentic-hil init` run
      # in this directory in the runner's own checkout, and it lives outside the
      # workspace. This job never creates it and never edits it: a configuration
      # bound to another directory is refused rather than reused, and one stored
      # inside the workspace is refused at load.
      #
      # This log is public, and doctor names the probe by its serial number, so
      # this and every step below that reaches the board prints through
      # tools/withhold.py: the withholding tools/bench_in_container.py gives the
      # gate's log, every attached probe's serial number and this machine's
      # names replaced by `[withheld]`, no line removed and the command's status
      # kept. It refuses to run anything when no attached probe shows a serial
      # number, since what it would have to withhold is then not known.
      - name: Report the bench this job is about to drive
        run: python3 ../../tools/withhold.py run -- agentic-hil doctor

      - name: Build the demo firmware for the board
        id: build
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

      # The declared plan, which is the demo's primary path and the one its
      # README reaches for: flash, open the port with a clean buffer, reset, and
      # read the boot banner. The reactor validates every device name, permission
      # and session order before the first hardware action, and closes the UART
      # session even when a step fails.
      #
      # The report is captured from `--json` into its own file, and that file is
      # what the evidence step below reads. Never
      # `.agentic-hil/reports/last-report.json`: a plan refused before its first
      # step writes nothing there, so the shared file would still hold an earlier
      # run's report and this job would publish it under this run's name.
      # `--json` is written on every path, a refusal included, and names the plan
      # it is about. It reaches the file as the plan wrote it, because the
      # evidence step reads the plan by the paths in it; the step that withholds
      # the evidence covers the file before it is uploaded.
      - name: Run the demo's test plan on the board
        id: plan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts/reports
          python3 ../../tools/withhold.py run --stdout-file artifacts/reports/testconfig.json -- agentic-hil test-reactor --test-config testconfig.yaml --json

      # The other way this demo reaches the board, and a different claim from the
      # plan above: the same four tools driven by hand through the `agentic_hil`
      # fixture, which the installed distribution registers as a pytest plugin.
      # A suite green here is a suite a project can embed beside its own tests.
      # pytest.ini anchors the rootdir to this directory, which is why the demo's
      # README runs it from here and why this job does too.
      - name: Run the same loop through the pytest plugin
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 ../../tools/withhold.py run -- pytest tests/

      # After the last step that reaches the board, and whatever happened: a red
      # plan and a cancelled run hold the machine as much as a green one. A take
      # that never held it finds nothing to give back and says so. The step
      # fails when the lock is no longer this job's, because the board may then
      # have been shared while the job believed it held it.
      - name: Give the machine's run lock back
        if: always()
        working-directory: .
        run: python3 tools/run_lock.py give-back --state "$RUNNER_TEMP/run-lock.json"

      # What a reviewer with no access to this bench reads: the outcome, the plan
      # and its digest, the tool versions, the bench identity by configuration
      # digest, the failing step with its error type, the same run as prose, and
      # a copy of the run's event logs. It is built from the report the step
      # above captured, whatever that run did, because the red run is the one
      # whose evidence matters most. The command appends its job summary to
      # `$GITHUB_STEP_SUMMARY` itself, so the readable version of the run is on
      # the job's own page and nothing here prints it a second time.
      - name: Collect the evidence for the run
        if: ${{ !cancelled() && steps.plan.outcome != 'skipped' }}
        run: python3 ../../tools/withhold.py run -- agentic-hil run-evidence --report artifacts/reports/testconfig.json --out artifacts/evidence

      # What the upload below takes, withheld in place the same way: the plan's
      # report, the OpenOCD and port logs and the report mirrors name the probe
      # by its serial number and the machine by its paths. After the last step
      # that writes them and whatever the run did, and every path the upload
      # names; a file nothing names the bench in is left as it is.
      - name: Withhold what names the bench from the evidence
        id: withhold
        if: always()
        run: python3 ../../tools/withhold.py files artifacts .agentic-hil/reports .agentic-hil/logs

      # Whatever the run did, because a cancelled run still leaves what it got
      # as far as, and only once the step above has withheld what it uploads: a
      # step that could not is a run whose evidence stays on the bench. `warn`
      # rather than `error` because a job that never reached a
      # report has already failed for a reason worth reading, and a second
      # failure from the upload step would sit on top of it.
      #
      # These are the workspace mirrors. The canonical, hash-chained copies stay
      # under the configuration's `state_root` on the bench and are never
      # uploaded: they are the ledger the mirrors are checked against, and
      # shipping them to an artifact store would publish the thing they exist to
      # verify.
      - name: Upload the run evidence
        if: ${{ always() && steps.withhold.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nucleo-f446re-bench-evidence
          path: |
            examples/nucleo-f446re_demo/artifacts/
            examples/nucleo-f446re_demo/.agentic-hil/reports/
            examples/nucleo-f446re_demo/.agentic-hil/logs/
          if-no-files-found: warn
          retention-days: 14

  # The bench tier, tests/bench, on every distribution other than the default
  # image's that tools/bench_in_container.py builds the tier's image on, one
  # after another on the same board once the demo's job is done. Each image
  # carries that distribution's own OpenOCD, cross compiler, GDB, CMake and
  # Python under the checkout's own product and tests, so a night's four
  # verdicts say which of those the commit still works with. How the images
  # are composed, and what each distribution packaged when it was measured, is
  # in tools/bench/README.md.
  distributions:
    name: Run the bench tier on the other distributions
    needs: bench
    # After a red demo too, because what the tier proves on a distribution does
    # not depend on what the demo found; never after a cancelled run, and never
    # in a fork, for the reason the job above gives.
    if: ${{ !cancelled() && github.repository == 'agentic-hil/agentic-hil' }}
    runs-on: [self-hosted, agentic-hil, nucleo-f446re]
    # Forty minutes for each distribution and ten for the checkout and the four
    # uploads, which took seconds on the bench. A step's forty minutes count its
    # wait for the machine too, as the gate's do. Measured on the bench, the
    # slowest distribution, Fedora 44, held the machine for 19m26s from the start
    # of its build to its verdict, so a whole run of the tier started on the
    # machine itself in front of it still leaves it its own time. A step still
    # waiting when its limit comes fails with nothing run on the board; one cut
    # short in the tier is interrupted as a cancelled gate is, which tears the
    # tier down and puts the demo back on the board.
    timeout-minutes: 170

    steps:
      # Credentials are not kept in the checkout: the image is built from the
      # committed tree and nothing here pushes, as in the gate.
      - name: Check out the commit this run is about
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each step is the gate's command with the distribution named: it queues
      # on the machine's run lock itself, so it waits for anything else on the
      # machine rather than meeting it at the board, builds the image, runs the
      # whole tier and reads its verdict. `exec` for the gate's reason: the
      # runner script is the step's process, and the SIGINT a cancelled or timed
      # out step sends reaches it rather than a shell, so the tier tears down and
      # puts the demo back on the board. After a red distribution the next still
      # runs; after a cancel, none. Each report goes into a directory of its own,
      # since the runner clears the one it is given of an earlier report.
      - name: Run the bench tier on Ubuntu 22.04
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: exec python3 tools/bench_in_container.py --distribution ubuntu-22.04 --output bench-results/ubuntu-22.04

      # Right after its run and whatever it did, so a later distribution's limit
      # cannot cost an earlier one its report. The report and the log have the
      # probe's serial numbers and the machine's names withheld.
      - name: Upload the Ubuntu 22.04 tier's report and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-tier-ubuntu-22.04
          path: bench-results/ubuntu-22.04/
          if-no-files-found: warn
          retention-days: 14

      - name: Run the bench tier on Ubuntu 24.04
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: exec python3 tools/bench_in_container.py --distribution ubuntu-24.04 --output bench-results/ubuntu-24.04

      - name: Upload the Ubuntu 24.04 tier's report and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-tier-ubuntu-24.04
          path: bench-results/ubuntu-24.04/
          if-no-files-found: warn
          retention-days: 14

      - name: Run the bench tier on Debian 12
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: exec python3 tools/bench_in_container.py --distribution debian-12 --output bench-results/debian-12

      - name: Upload the Debian 12 tier's report and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-tier-debian-12
          path: bench-results/debian-12/
          if-no-files-found: warn
          retention-days: 14

      - name: Run the bench tier on Fedora 44
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: exec python3 tools/bench_in_container.py --distribution fedora-44 --output bench-results/fedora-44

      - name: Upload the Fedora 44 tier's report and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-tier-fedora-44
          path: bench-results/fedora-44/
          if-no-files-found: warn
          retention-days: 14
