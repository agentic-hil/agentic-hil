name: Python CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e '.[dev,can]'

      - name: Lint
        run: ruff check src tests evals tools

      - name: Check shipped repository references
        run: python tools/check_shipped_references.py

      - name: Run tests
        run: pytest

      - name: Check package build
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      # twine check reads metadata; it never unpacks the archive and runs it.
      # A downstream maintainer who builds from the sdist runs the tests it
      # ships, and those failed at collection because the repository-only
      # tooling they imported is deliberately not package content.
      - name: Check the source distribution's own test suite runs
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          set -eux
          rm -rf sdist-check
          mkdir sdist-check
          tar -xzf dist/*.tar.gz -C sdist-check --strip-components=1
          python -m venv sdist-check/.venv
          sdist-check/.venv/bin/python -m pip install --quiet dist/*.tar.gz pytest
          cd sdist-check && ./.venv/bin/python -m pytest -q

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install '.[can,pyocd]'

      - name: Audit production dependencies
        run: |
          python -m pip install pip-audit
          pip-audit

  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test
      - audit
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Python test matrix finished with ${{ needs.test.result }}"
            exit 1
          fi
          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "Dependency audit finished with ${{ needs.audit.result }}"
            exit 1
          fi
