name: Python CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 45 minutes for the whole job, and the suite is the part that grows into
    # it. In one process the Windows legs took about fourteen minutes of pytest
    # alone on an ordinary runner and twenty-three on a slow one, which was
    # close enough to the limit of the day to cancel two runs whose tests were
    # green: one inside `Run tests` at 25m18s with 2307 tests already passed,
    # one after pytest had printed `2754 passed, 84 skipped in 1400.29s`, in the
    # step after it. The step below runs the suite across the runner's cores,
    # which bought those minutes back, and the suite has since grown to 4174
    # tests: the Windows legs of one commit took 20m13s, 21m17s and 22m17s, the
    # fourth was cancelled at 25 minutes with every test that had run green, and
    # the next run cancelled a different leg the same way. A Linux leg of that
    # same suite is about five and a half minutes, so the four is the platform's
    # own cost rather than one slow machine, and #536 is where that is being
    # answered. This limit is margin for a slow runner rather than a deadline a
    # slow runner beats, and a leg that reaches it is a hang and not a queue.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Dependencies come from a hash-pinned lock so pip can reject a substituted
      # artifact; the project itself is then installed editable with --no-deps,
      # because a local path has no artifact to hash and pip refuses to mix the
      # two modes in one command.
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements/dev.txt

      - name: Install package
        run: python -m pip install --no-deps -e .

      - name: Lint
        run: ruff check src tests evals tools

      - name: Check shipped repository references
        run: python tools/check_shipped_references.py

      # Across the runner's cores, which is what a developer run already uses.
      # Almost nothing in the suite needs a worker to itself: every test gets its
      # own HOME, config, state and temporary storage, and its device-lock root,
      # its CAN broker endpoint and its run records all follow that HOME, so two
      # workers cannot meet in a configuration, a lock, a socket or a scratch
      # file. The one thing two of them do share is the machine's process table,
      # which step 5 of install.ps1 reads whole; those tests carry an
      # `xdist_group` mark and `pyproject.toml`'s `addopts` carries the
      # `--dist loadgroup` that keeps a group on one worker, so this line needs
      # no scheduler of its own and must not pass one, which would override it.
      # CONTRIBUTING.md, under "Running the suite on all cores", carries what a
      # new test has to keep true for the rest of that to stay so. The worker
      # count is named here rather than in `addopts`, so a bare `pytest` in a
      # checkout is still one process and a failure can be read without a worker
      # id in front of it.
      - name: Run tests
        run: pytest -n auto

      - name: Check package build
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      # tools/ and evals/ are repository tooling, not package content, so
      # MANIFEST.in does not ship them; a test that reaches either at module
      # scope has to be on MANIFEST.in's exclusion list or it fails to collect
      # from the sdist this job just built and checked, the way
      # tests/test_shipped_references.py did until that list named it too.
      # Collection only, not a run: this job's dev dependencies are already on
      # this interpreter, so unpacking the sdist only has to prove pytest can
      # still find its way through what it ships.
      - name: Collect the source distribution's tests
        shell: bash
        run: |
          rm -rf sdist-check
          mkdir sdist-check
          tar xzf dist/agentic_hil-*.tar.gz -C sdist-check
          cd sdist-check/agentic_hil-*
          python -m pytest --collect-only -q

  # The tier the matrix above cannot run. Every test in the matrix is written
  # against a fake, so the suite is only ever as right as the person who wrote
  # the fake was about the tool, and four defects reached a bench through that
  # gap: uv writes `python` at the `[tool]` level of its receipt, a virtual
  # environment's process resolves its image to the system interpreter, a procfs
  # directory's creation time is the time of the lookup, and OpenOCD prints an
  # error line after a reset that succeeded. This job runs the real uv, the real
  # OpenOCD and the real /proc, in the image the repository publishes them with,
  # so the environment is part of the result rather than a property of whoever
  # happened to run it.
  #
  # ubuntu-latest, and one leg: the tools these tests are about are the same on
  # every runner, and what varies between runners is exactly what the matrix
  # above already covers. It needs the network, because uv resolves this
  # distribution's dependency set from the package index and one test reads the
  # release index over HTTPS to establish that a currency claim is only made
  # after the index has answered. It needs NET_ADMIN and the host's `vcan` and
  # `can_raw` modules, because the CAN sub-tier binds the product's SocketCAN
  # transport to a virtual interface it creates.
  #
  # Measured cold, with no layer cache and the base image pulled, which is what
  # a hosted runner has: about two minutes to build the image, most of it apt
  # and the locked dependency set over the network, and a few minutes to run
  # the tests, whose wall clock is set by the serial reads over the
  # pseudo-terminal pair and the CAN reads over the virtual interface that
  # prove their own timeouts rather than by any single tool. The limit below
  # is margin for a slow runner and a slow index rather than a deadline a slow
  # runner beats.
  container_tests:
    name: Container tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BUILDKIT explicitly, because the ignore file this build uses is the one
      # beside its Dockerfile: the repository root's `.dockerignore` belongs to
      # the evaluation images and sends only `evals/` and `src/`, and only
      # BuildKit reads `<dockerfile>.dockerignore` in preference to it.
      - name: Build the container test image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -f tools/container/Dockerfile -t agentic-hil-container-tests .

      # The CAN tests bind the product's SocketCAN transport to a virtual CAN
      # interface the container creates. A container cannot load a kernel
      # module, so the runner's kernel has to carry `vcan` before the run, and
      # the hosted image does not load it by itself. Its own step, so a runner
      # kernel without the module fails the job here with modprobe's own line
      # rather than as a tier that skipped itself below; the check further down
      # would catch that skip too, but this names the cause.
      - name: Load the virtual CAN module on the runner
        run: |
          sudo modprobe vcan || { sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vcan; }
          sudo modprobe can_raw
          lsmod | grep -E '^(vcan|can_raw) '

      # The marker as well as the path, so a test that lands in this directory
      # without it is a test this job does not silently start running, and the
      # variable the image already sets is passed again here as the statement it
      # is: these tests run because this run means them to. NET_ADMIN is what
      # lets the CAN tests create their virtual interface inside the container;
      # nothing else in the tier needs a capability. The serial tests need
      # what a container has by default and this line leaves alone: the devpts
      # that socat allocates its pseudo-terminal pair from, and root inside the
      # container, which two of them use to drop a server to `nobody` and read
      # what the kernel's permission checks answer it.
      - name: Run the container tests
        run: |
          mkdir -p container-report
          docker run --rm --cap-add NET_ADMIN -e AGENTIC_HIL_CONTAINER_TESTS=1 -v "$PWD/container-report:/report" agentic-hil-container-tests \
            python -m pytest tests/container -m container -q --junitxml=/report/container-tests.xml

      # This job's whole claim is that it ran the real uv, the real OpenOCD,
      # the real /proc, a real terminal device and a real SocketCAN transport,
      # and pytest exits 0 for a tier in which every test skipped. Green over
      # fifteen skips and green over fifteen passes are indistinguishable to a
      # workflow that reads only the status, so the report is what the claim
      # is read out of: tests ran, none of them skipped, none of them errored.
      # A transport that could not be created (no socat, no devpts, no `vcan`
      # or `can_raw` on the runner, no NET_ADMIN on the run, no `nobody` to
      # drop to) is a skip with that reason in its fixture, and a skip is what
      # this step turns red, with the reasons printed so the cause is on the
      # job page rather than a tier gone green having proved nothing.
      - name: Check the container tests actually ran
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("container-report/container-tests.xml").getroot()
          suites = root.findall("testsuite") or [root]
          tests = sum(int(suite.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          errors = sum(int(suite.get("errors", 0)) for suite in suites)
          print(f"{tests} test(s) ran, {skipped} skipped, {errors} error(s)")
          for case in root.iter("testcase"):
              for verdict in case.findall("skipped") + case.findall("error"):
                  print(f"{verdict.tag}: {case.get('classname')}::{case.get('name')}: {verdict.get('message') or verdict.text or ''}")
          if tests == 0 or skipped or errors:
              print("This tier has to run every test it collects: a tier that skipped proves nothing and still reports success.")
              sys.exit(1)

  release_metadata:
    name: Release metadata consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, which is what brings the tags. The check refuses a tree
      # whose src/agentic_hil has moved past the release its version still
      # claims, and the release tag is the only thing that can answer that
      # offline. A tag it cannot reach is a warning rather than a failure, so
      # with the default shallow fetch this job would report that it could not
      # establish the thing it exists to establish, on every pull request, and
      # pass.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # Deliberately no `paths:` filter on the pull_request trigger. The failure
      # this job exists to catch is a change that FORGETS one of the files that
      # carry the version, and a paths filter keys on the files a pull request
      # touched, so the one case it must catch is the case it would skip. It
      # would also be a second hand-maintained enumeration of exactly the list
      # that already drifted. The check is file reads and string comparisons;
      # there is nothing worth saving.
      - name: Check release version consistency
        run: python tools/check_version_consistency.py

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install '.[can,pyocd]'

      - name: Audit production dependencies
        run: |
          python -m pip install pip-audit
          pip-audit

  agent-registration:
    name: Agent registration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify install.sh and Codex/Claude Code registration with real CLIs
        run: python tools/test_agent_registration.py

      - name: Upload registration gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-registration-gate
          path: evals/install/artifacts/registration-gate/
          if-no-files-found: error

  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test
      - container_tests
      - release_metadata
      - audit
      - agent-registration
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Python test matrix finished with ${{ needs.test.result }}"
            exit 1
          fi
          if [[ "${{ needs.container_tests.result }}" != "success" ]]; then
            echo "Container tests finished with ${{ needs.container_tests.result }}"
            exit 1
          fi
          if [[ "${{ needs.release_metadata.result }}" != "success" ]]; then
            echo "Release metadata consistency finished with ${{ needs.release_metadata.result }}"
            exit 1
          fi
          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "Dependency audit finished with ${{ needs.audit.result }}"
            exit 1
          fi
          if [[ "${{ needs.agent-registration.result }}" != "success" ]]; then
            echo "Agent registration gates finished with ${{ needs.agent-registration.result }}"
            exit 1
          fi
