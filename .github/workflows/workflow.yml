name: Publish PyPI package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything this job does that needs no tag also runs pre-merge, in the
  # `Release metadata consistency` job of .github/workflows/ci.yml, from the same
  # module. Publishing a release used to be the first moment a version mismatch
  # became visible, which is the point of no return: a PyPI version cannot be
  # re-uploaded. What is left here that pre-merge cannot do is `--release-tag`:
  # the tag exists only once the release is created.
  validate_release:
    name: Validate release metadata
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Check shipped repository references
        run: python tools/check_shipped_references.py

      # The same module the pull request already ran, plus the tag. Passing the
      # tag is the only part of this that could not have run before the merge.
      - name: Verify release metadata and local contracts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_version_consistency.py --release-tag "$RELEASE_TAG"

  publish:
    needs: validate_release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-hil
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements/build.txt

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The shipped CI examples pin AGENTIC_HIL_VERSION to the release this tree
  # builds toward -- the release that first exposes the check-plan and
  # run-evidence commands they invoke. tests/test_ci_examples.py proves against
  # this checkout's parser that the examples invoke only commands the code
  # defines, but it has no network and, between releases, that pin names a
  # release the index does not carry yet. This is the one moment the pin is a
  # real distribution: after PyPI has the release. So here the exact pinned
  # artifact is downloaded and its CLI is asked to answer for itself, closing the
  # gap the review kept naming -- that nothing reached the published distribution
  # to confirm it exposes the commands a copied example runs. It runs after the
  # PyPI upload, which is the point of no return, so it is an alarm and not a
  # gate: you cannot inspect a published artifact before it is published.
  verify-published-examples:
    name: Verify the CI example pin resolves
    needs:
      - validate_release
      - publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # The one string a reader copies, read out of the examples themselves and
      # confirmed to be the release this tree builds toward before anything is
      # installed. This is what turns "a version" into "the exact pinned
      # artifact" the rest of the job downloads.
      - name: Read the pinned example version
        run: echo "EXAMPLE_PIN=$(python tools/verify_published_examples.py --print-pin)" >> "$GITHUB_ENV"

      # Isolated, so this is the distribution PyPI serves and never the checkout,
      # and retried because index metadata lags a fresh upload by up to minutes.
      - name: Install the pinned distribution from PyPI
        run: |
          set -euo pipefail
          python -m venv verify-env
          for attempt in 1 2 3 4 5 6; do
            if verify-env/bin/pip install --no-cache-dir "agentic-hil==${EXAMPLE_PIN}"; then
              exit 0
            fi
            if [ "$attempt" = 6 ]; then
              echo "agentic-hil==${EXAMPLE_PIN} is not installable from PyPI" >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

      # The published artifact answers for itself: its --version is the pin, and
      # every command the examples invoke answers --help.
      - name: Verify the published CLI exposes every command the examples invoke
        run: python tools/verify_published_examples.py --agentic-hil verify-env/bin/agentic-hil

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs:
      - validate_release
      - publish
    if: ${{ always() && needs.validate_release.result == 'success' && ((github.event_name == 'release' && needs.publish.result == 'success') || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set registry release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          package_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          release_tag = os.environ.get("RELEASE_TAG")
          if release_tag and release_tag.removeprefix("v") != package_version:
              raise SystemExit("release metadata changed after the validation job")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"MCP_RELEASE_VERSION={package_version}\n")
          PY

      - name: Wait for verifiable PyPI metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["MCP_RELEASE_VERSION"]
          url = f"https://pypi.org/pypi/agentic-hil/{version}/json"
          marker = "<!-- mcp-name: io.github.agentic-hil/agentic-hil -->"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      metadata = json.load(response)
                  if marker in metadata["info"]["description"]:
                      break
              except (OSError, urllib.error.HTTPError, json.JSONDecodeError):
                  pass
              if attempt == 11:
                  raise SystemExit(f"PyPI metadata for agentic-hil {version} is not registry-verifiable")
              time.sleep(10)
          PY

      - name: Install pinned MCP publisher
        run: |
          echo "MCP_PUBLISHER=$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_ENV"
          bash .github/scripts/install-mcp-publisher.sh "$RUNNER_TEMP/mcp-publisher"

      - name: Validate published server metadata
        run: |
          "$MCP_PUBLISHER" validate server.json

      - name: Authenticate to MCP Registry
        run: |
          "$MCP_PUBLISHER" login github-oidc

      - name: Publish to MCP Registry
        run: |
          for attempt in 1 2 3 4; do
            if "$MCP_PUBLISHER" publish server.json; then
              exit 0
            fi
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.agentic-hil%2Fagentic-hil/versions/$MCP_RELEASE_VERSION" || true)"
            if [[ "$status" == "200" ]]; then
              echo "MCP Registry already contains io.github.agentic-hil/agentic-hil $MCP_RELEASE_VERSION"
              exit 0
            fi
            if [[ "$attempt" == "4" ]]; then
              echo "MCP Registry publication failed after $attempt attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

  release-assets:
    name: Attach SBOM and attestations
    needs: validate_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements/sbom.txt

      - name: Build distributions
        run: python -m build

      - name: Generate SBOM
        run: |
          python -m venv sbom-env
          sbom-env/bin/pip install dist/*.whl
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json sbom-env/bin/python

      - name: Attest distributions
        id: attest-dists
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json

      - name: Stage release attestation assets
        run: |
          set -euo pipefail
          cp "${{ steps.attest-dists.outputs.bundle-path }}" agentic-hil-dists.intoto.jsonl
          cp "${{ steps.attest-sbom.outputs.bundle-path }}" agentic-hil-dists.sbom.intoto.jsonl

      - name: Upload distributions, SBOM, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* sbom.cdx.json ./*.intoto.jsonl --repo "$GITHUB_REPOSITORY" --clobber
