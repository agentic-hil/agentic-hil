# Copy examples/nucleo-f446re_demo to a scratch directory without its build/.
# Replace Src/main.c with tests/bench/firmware/undefined_instruction.c.
# In the copy, run cmake --preset Debug --fresh and cmake --build --preset Debug.
# Copy build/Debug/nucleo-f446re_demo.elf to build/hil/f446re_undefined_instruction.elf
# under the plan's workspace root.
version: 5
name: Nucleo-F446RE fault stop companion
steps:
  - action: flash
    debugger: f446re
    image_path: build/hil/f446re_undefined_instruction.elf
    reset_after_flash: false
  - action: uart_open
    port_id: f446re_vcp
    clear_buffer: true
  - action: reset
    debugger: f446re
    mode: run
  - action: uart_expect
    port_id: f446re_vcp
    text: "undefined instruction image booted\n"
    timeout_s: 5
  - action: uart_close
    port_id: f446re_vcp
  - action: debug_start
    debugger: f446re
    image_path: build/hil/f446re_undefined_instruction.elf
    mode: reset_halt
  - action: run_until_breakpoint
    debugger: f446re
    location: main
    timeout_s: 5
  - action: run_until_breakpoint
    debugger: f446re
    location: HardFault_Handler
    timeout_s: 5
  - action: debug_stop
    debugger: f446re
