version: 4
name: nano-esp32s3-console-refuses-flash
steps:
  - port_id: esp32s3
    action: uart_open
    clear_buffer: true
  - port_id: esp32s3
    action: uart_read
    comparator: {pattern: '(?m)^agentic-hil esp32s3 image [AB] tick [0-9]+\r?\n'}
    timeout_s: 5
  - debugger: esp32s3
    action: flash
    image_path: examples/nano-esp32s3_demo/banner_a.bin
    reset_after_flash: false
