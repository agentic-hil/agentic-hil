version: 4
name: nano-esp32s3-shared-bench
steps:
  - action: repeat
    count: 20
    steps:
      - debugger: esp32s3
        action: flash
        image_path: examples/nano-esp32s3_demo/banner_a.bin
        reset_after_flash: false
      - debugger: esp32s3
        action: reset
        mode: run
      - port_id: esp32s3
        action: uart_open
        clear_buffer: true
      - port_id: esp32s3
        action: uart_read
        comparator: {pattern: '(?m)^agentic-hil esp32s3 image A tick [0-9]+\r?\n'}
        timeout_s: 5
      - port_id: esp32s3
        action: uart_read
        comparator: {pattern: '(?m)^agentic-hil esp32s3 image A tick 50\r?\nagentic-hil esp32s3 image A tick 51\r?\n'}
        timeout_s: 8
      - port_id: esp32s3
        action: uart_close
      - debugger: esp32s3
        action: flash
        image_path: examples/nano-esp32s3_demo/banner_b.bin
        reset_after_flash: false
      - debugger: esp32s3
        action: reset
        mode: run
      - port_id: esp32s3
        action: uart_open
        clear_buffer: true
      - port_id: esp32s3
        action: uart_read
        comparator: {pattern: '(?m)^agentic-hil esp32s3 image B tick [0-9]+\r?\n'}
        timeout_s: 5
      - port_id: esp32s3
        action: uart_read
        comparator: {pattern: '(?m)^agentic-hil esp32s3 image B tick 50\r?\nagentic-hil esp32s3 image B tick 51\r?\n'}
        timeout_s: 8
      - port_id: esp32s3
        action: uart_close
