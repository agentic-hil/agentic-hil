# STM32CubeProgrammer plan. This backend supports flash/verify/reset and UART,
# but deliberately contains no typed debug action (those require OpenOCD).
#
# Deliberately left at `version: 2`, with its explicit closes, for the same
# reason as the OpenOCD plan beside it: a v2 plan driven against real hardware.
version: 2
name: nucleo-f446re-stlink
steps:
  - debugger: dut
    action: flash
    image_path: build/Debug/nucleo-f446re_demo.elf
    reset_after_flash: true

  - port_id: dut_uart
    action: uart_open

  - port_id: dut_uart
    action: uart_close
