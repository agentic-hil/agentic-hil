# OpenOCD reactor plan: flash, open UART, and prove execution reached `delay`
# through a typed GDB/MI debug session before closing every session.
#
# Deliberately left at `version: 2`, with its explicit closes: this is the one
# place a v2 plan is still driven end to end against real hardware, and that is
# worth more here than the shorter v3 spelling. The examples/ plans show v3.
version: 2
name: nucleo-f446re-openocd
steps:
  - debugger: dut
    action: flash
    image_path: build/Debug/nucleo-f446re_demo.elf
    reset_after_flash: true

  - port_id: dut_uart
    action: uart_open

  - debugger: dut
    action: debug_start
    image_path: build/Debug/nucleo-f446re_demo.elf
    mode: reset_halt

  - debugger: dut
    action: run_until_breakpoint
    location: delay
    timeout_s: 5

  - debugger: dut
    action: debug_stop

  - port_id: dut_uart
    action: uart_close
