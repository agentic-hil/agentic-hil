# Test plan only. Hardware resources and permissions always come from the
# discovered external authoritative file or AGENTIC_HIL_CONFIG override.
# Steps address configured devices by their names: `debugger` names a
# `debuggers` entry, `port_id` names a `com_ports` entry. `debugger` may be
# omitted while the config declares exactly one probe; with several, name it —
# e.g. a second board as
#   - {debugger: dut_b, action: flash, image_path: build/sensor.elf}
version: 1
name: capture-state
steps:
  - debugger: dut
    action: flash
    image_path: build/app.elf

  - port_id: dut_uart
    action: uart_open

  - debugger: dut
    action: debug_start
    image_path: build/app.elf
    mode: attach

  - debugger: dut
    action: run_until_breakpoint
    location: capture_done
    timeout_s: 5

  - debugger: dut
    action: dump_memory
    symbol: capture_buffer
    output_path: build/capture.hex

  - debugger: dut
    action: debug_stop

  - port_id: dut_uart
    action: uart_close
