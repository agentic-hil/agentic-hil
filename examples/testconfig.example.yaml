# Test plan only. Hardware resources and permissions always come from the
# discovered external authoritative file or AGENTIC_HIL_CONFIG override.
# Every step names the configured entry it drives with `device:` — the
# configuration knows whether that name is a `debuggers`, a `com_ports` or a
# `can_buses` entry, so the plan does not have to spell it. The version 2 keys
# `debugger:`, `port_id:` and `bus_id:` stay valid as readable aliases; a step
# writes one or the other, never both. `device:` may be omitted on a debugger
# step while the config declares exactly one probe; with several, name it — e.g.
# a second board as
#   - {device: dut_b, action: flash, image_path: build/sensor.elf}
# The CAN steps below only read: the example configuration's `dut_can` is
# `listen_only: true`, which is the claim that observing that bus sends nothing,
# and a `can_send` step on such a bus is refused before the run starts.
# There are no close steps: end-of-run cleanup closes every session this run
# opened. Write an explicit close only where the plan means to close,
# reconfigure and reopen a line or a bus mid-run.
version: 3
name: capture-state
steps:
  - device: dut
    action: flash
    image_path: build/app.elf

  - device: dut_uart
    action: uart_open
    clear_buffer: true

  - device: dut_can
    action: can_open
    clear_rx_queue: true

  # Serial stimulus, through the same permission-gated tool an agent driving the
  # line by hand would call. Requires permissions.allow_write on the port; a
  # port that denies it refuses this step by name before the run starts.
  - device: dut_uart
    action: uart_write
    text: "capture\n"

  # What the read is claiming, not merely that something arrived. `equals:` is
  # the whole value; `pattern:` with `range:` holds a captured number to bounds
  # and names the value it did read when it falls outside them.
  - device: dut_uart
    action: uart_read
    comparator:
      pattern: "temp=(\\d+)C"
      range: { min: 20, max: 30 }
    timeout_s: 5

  - device: dut
    action: debug_start
    image_path: build/app.elf
    mode: attach

  - device: dut
    action: run_until_breakpoint
    location: capture_done
    timeout_s: 5

  # What the read is claiming on a bus: which frame, and what it must carry.
  # `id:` is required — a bus carries every node's traffic, so a payload matched
  # without saying whose frame it was is a green another ECU can produce — and
  # `id_mask:` widens it into a family where a protocol encodes a node in the
  # low bits. The payload claim reads the payload as hexadecimal, so a `range:`
  # capture is read in that base too. `max_frames` is how many frames one read
  # drains; the step reads again until the claim is met or `timeout_s` passes.
  # Without a comparator this is a plain read of whatever the session has,
  # exactly as version 2 wrote it.
  - device: dut_can
    action: can_read
    comparator:
      id: "0x201"
      pattern: "^02(..)$"
      range: { min: 20, max: 30 }
    max_frames: 64
    timeout_s: 5

  - device: dut
    action: dump_memory
    symbol: capture_buffer
    output_path: build/capture.hex

  - device: dut
    action: debug_stop
