# Bootstrap profile for `agentic-hil init` / `setup`, and not a configuration:
# it says how a discovered bench is named and narrowed, while the authoritative
# file is written outside this repository. Exactly four keys are read off it,
# `target`, `debuggers`, `artifacts` and `com_ports`; anything written here
# under another name is read past without a word.
#
# That is why the roots are absent rather than shown as placeholders. The
# command that generates the configuration binds `workspace_root` to the project
# it ran in and `state_root` to the operator's own state directory, so either of
# them written here would be overwritten in silence. Debugger/probe, target and
# serial bindings do resolve externally, and the placeholders below show their
# final shape.
#
# The config it produces is written at version 3, where reading needs no
# permission, so a profile only ever requests what writes or changes state, and
# where every com_ports entry has to say which hardware it is. This profile does
# not: `device` below is a placeholder, and the serial number that identifies the
# port is filled in from the attached adapter when the config is generated.

target:
  name: "nucleo-f446re-demo"
  controller: "stm32f446ret6"

# Every device is named, and the name is how test plans and MCP tool calls
# address it. Reading a device needs no permission: every device a test plan
# names is locked for the whole run, and a device the plan does not name is
# refused. Writing and state-changing operations are deny-by-default, per
# device: what is not listed here is refused.
debuggers:
  dut:
    type: "openocd"          # or "stlink" for STM32CubeProgrammer CLI
    interface_cfg: "/absolute/path/to/openocd/scripts/interface/stlink.cfg"
    target_cfg: "/absolute/path/to/openocd/scripts/target/stm32f4x.cfg"
    timeout_s: 60
    permissions:
      allow_flash: true
      allow_reset: true
      allow_raw_debugger_commands: false
      allow_mass_erase: false

artifacts:
  allowed_roots: ["."]       # the whole workspace, recursively; name directories to narrow it
  allowed_extensions: [".elf", ".hex", ".bin"]

com_ports:
  dut_uart:
    device: "/dev/ttyACM0"   # Nucleo ST-LINK virtual COM port; e.g. COM5 on Windows
    baudrate: 115200
    permissions:
      allow_write: false
