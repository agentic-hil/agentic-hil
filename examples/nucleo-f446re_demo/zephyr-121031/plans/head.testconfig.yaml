# Generated by the hil-validations bench gate; do not edit.
#
# Flashes head.elf without a reset, opens the ST-LINK virtual COM port with a
# cleared buffer and resets the board. The plan then
# records what the image prints until it says 'HQ172 done'. The tests that
# sent the image judge its lines from the raw values in the serial log.
version: 4
name: hilval-hq172-head
steps:
  - device: dut
    action: flash
    image_path: build/hilval-hq172/head.elf
    reset_after_flash: false
  - device: dut_uart
    action: uart_open
    clear_buffer: true
  - device: dut
    action: reset
    mode: run
  - device: dut_uart
    action: uart_read
    timeout_s: 240
    comparator:
      pattern: '(?m)^HQ172 done\r?$'
  - device: dut_uart
    action: uart_close
