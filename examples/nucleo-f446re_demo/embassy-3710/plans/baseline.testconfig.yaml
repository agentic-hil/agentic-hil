# Generated by the hil-validations bench gate; do not edit.
#
# Flashes baseline.elf without a reset, opens the ST-LINK virtual COM port with a
# cleared buffer and resets the board. The plan then
# records what the image prints until it says 'HQ175 done'. The tests that
# sent the image judge its lines from the raw values in the serial log.
version: 4
name: hilval-hq175-baseline
steps:
  - device: dut
    action: flash
    image_path: build/hilval-hq175/baseline.elf
    reset_after_flash: false
  - device: dut_uart
    action: uart_open
    clear_buffer: true
  - device: dut
    action: reset
    mode: run
  - device: dut_uart
    action: uart_read
    timeout_s: 120
    comparator:
      pattern: '(?m)^HQ175 done\r?$'
  - device: dut_uart
    action: uart_close
