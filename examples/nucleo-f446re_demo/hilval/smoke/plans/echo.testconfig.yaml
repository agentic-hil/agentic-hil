# Generated by the hil-validations bench gate; do not edit.
#
# Flashes echo.elf without a reset, opens the ST-LINK virtual COM port with a
# cleared buffer and resets the board. The plan then
# answers each 'SMK ready seq=<n>' line by writing the n-th stimulus, and
# records what the image prints until it says 'SMK done'. The tests that
# sent the image judge its lines from the raw values in the serial log.
version: 4
name: hilval-smoke-echo
steps:
  - device: dut
    action: flash
    image_path: build/hilval-smoke/echo.elf
    reset_after_flash: false
  - device: dut_uart
    action: uart_open
    clear_buffer: true
  - device: dut
    action: reset
    mode: run
  - device: dut_uart
    action: uart_read
    timeout_s: 30
    comparator:
      pattern: '(?m)^SMK ready seq=1\r?$'
  - device: dut_uart
    action: uart_write
    hex: '68696c76616c20736d6f6b652000017f80feff'
  - device: dut_uart
    action: uart_read
    timeout_s: 30
    comparator:
      pattern: '(?m)^SMK ready seq=2\r?$'
  - device: dut_uart
    action: uart_write
    hex: '41c3c143'
  - device: dut_uart
    action: uart_read
    timeout_s: 30
    comparator:
      pattern: '(?m)^SMK ready seq=3\r?$'
  - device: dut_uart
    action: uart_write
    hex: 'c14341c3'
  - device: dut_uart
    action: uart_read
    timeout_s: 30
    comparator:
      pattern: '(?m)^SMK ready seq=4\r?$'
  - device: dut_uart
    action: uart_write
    hex: '01'
  - device: dut_uart
