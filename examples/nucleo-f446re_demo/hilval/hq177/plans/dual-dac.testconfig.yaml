# Generated by the hil-validations bench gate; do not edit.
#
# Flashes dual-dac.elf without a reset, opens the ST-LINK virtual COM port with a
# cleared buffer and resets the board. The plan then
# records what the image prints until it says 'HQ177 done'. The tests that
# sent the image judge its lines from the raw values in the serial log.
version: 4
name: hilval-hq177-dual-dac
steps:
  - device: dut
    action: flash
    image_path: build/hilval-hq177/dual-dac.elf
    reset_after_flash: false
  - device: dut_uart
    action: uart_open
    clear_buffer: true
  - device: dut
    action: reset
    mode: run
  - device: dut_uart
    action: uart_read
    timeout_s: 60
    comparator:
      pattern: '(?m)^HQ177 done\r?$'
  - device: dut_uart
    action: uart_close
