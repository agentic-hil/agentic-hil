# An Embassy image for the NUCLEO-F446RE, built by toolchain.cargo_image (see ../README.md).
# @EMBASSY@ and @STM32_DATA@ are replaced by the checkouts the build names.
[package]
name = "hqimage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-stm32 = { path = "@EMBASSY@/embassy-stm32", features = ["stm32f446re", "unstable-pac", "memory-x", "time-driver-tim4", "exti", "rt"] }
embassy-executor = { path = "@EMBASSY@/embassy-executor", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { path = "@EMBASSY@/embassy-time", features = ["tick-hz-32_768"] }
embassy-futures = { path = "@EMBASSY@/embassy-futures" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

# embassy-stm32 takes its register definitions from this git repository; the
# source cache holds the matching checkout, so the build stays offline.
[patch."https://github.com/embassy-rs/stm32-data-generated"]
stm32-metapac = { path = "@STM32_DATA@/stm32-metapac" }

[profile.release]
debug = 2
opt-level = "s"
