[package]
name = "hq184-fw"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# Keeps this crate out of any enclosing workspace: the delegated build names this manifest.
[workspace]

[[bin]]
name = "hq184-fw"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"

# One revision for every Embassy crate. The SPI clock helper under test is not patched.
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "c70760de42e2c8103138da6ff91626ff5a2688ba", features = ["stm32f446re", "unstable-pac"] }

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
debug = 1
