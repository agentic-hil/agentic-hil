# The demo loop, declared: build → flash → reset → assert on serial output. This
# is the primary way to run this demo — an agent asked to test this firmware
# should reach for the plan below rather than write its own loop.
#
# Test plan only. Hardware resources and permissions always come from the
# discovered external authoritative file or AGENTIC_HIL_CONFIG override, which
# is where `dut` and `dut_uart` below are declared — see
# agentic-hil.config.example.yaml.
#
# Build the ELF first, then from this directory:
#   agentic-hil test-reactor --test-config testconfig.yaml
#
# The reactor validates every device name, permission and session order before
# the first hardware action, closes the UART session even if a step fails, and
# fails the run when `Hello World` does not reach the port in time — with the
# tail of what the port did say, so a silent board and a wrong banner read
# differently.
#
# `device:` names a configured entry; the configuration knows whether that name
# is a debugger, a COM port or a CAN bus. There is no close step: end-of-run
# cleanup closes every session the run opened, so an explicit close is only
# worth writing when the plan means to close, reconfigure and reopen mid-run.
#
# `comparator:` says what the read is claiming. `equals:` is the whole value
# rather than a substring: a complete line matches as soon as its terminator
# arrives — which is what this firmware's `printf("Hello World\n")` sends — and
# output the board never terminates is judged once the timeout runs out, so a
# value still being printed cannot pass early.
# Reach for `pattern:` when the check is that the board answered with
# the *right* value rather than merely that it answered, and add `range:` when
# that value is a number that has to fall inside bounds:
#   comparator: {pattern: "temp=(\\d+)C", range: {min: 20, max: 30}}
# `pattern:` is `re.search`, so it is anchored only where the pattern says: write
# `^` or `$` when the position is part of the claim. With `range:` the pattern
# must have exactly one capture group, which is where the number is read from.
version: 3
name: nucleo-f446re-hello-world
steps:
  # `reset_after_flash: false` is the default and is written out because the
  # rest of this plan depends on it: the board stays where the flash left it
  # until the reset step below, which is what lets the port be open before the
  # firmware starts printing. Flashing with a reset here would boot the board
  # into a port nobody is listening on yet.
  - device: dut
    action: flash
    image_path: build/Debug/nucleo-f446re_demo.elf
    reset_after_flash: false

  # Opened before the reset, so the banner the firmware prints at boot is
  # already being captured when the core starts running. `clear_buffer` discards
  # whatever the line buffered before this step, which is what makes the match
  # below a claim about *this* boot rather than about something still sitting in
  # the buffer from a previous run. It is the default; written out because it is
  # load-bearing here.
  - device: dut_uart
    action: uart_open
    clear_buffer: true

  - device: dut
    action: reset
    mode: run

  - device: dut_uart
    action: uart_read
    comparator:
      equals: "Hello World"
    timeout_s: 5
