site_name: Agentic HIL
site_description: Safe local hardware-in-the-loop for AI agents over MCP
site_url: https://agentic-hil.readthedocs.io/
repo_url: https://github.com/agentic-hil/agentic-hil
repo_name: agentic-hil/agentic-hil
edit_uri: edit/master/docs/

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - MCP hosts: mcp-hosts.md
  - MCP tools: mcp-tools.md
  - Testing: testing.md
  - Test plan contract: test-plan-contract.md
  - Safety model: safety-model.md
  - Security design: security-design.md
  - Designs:
      - CAN as a service: can-service-design.md
      - GitHub Action: github-action-design.md
  - Project:
      - Release strategy: release-strategy.md
      - Repository security: repository-security.md

validation:
  links:
    unrecognized_links: warn
    anchors: warn
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
