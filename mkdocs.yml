site_name: Agentic HIL
site_description: Safe local hardware-in-the-loop for AI agents over MCP
site_url: https://agentic-hil.readthedocs.io/
repo_url: https://github.com/agentic-hil/agentic-hil
repo_name: agentic-hil/agentic-hil
edit_uri: edit/master/docs/

# No explicit nav: every page under docs/ is picked up automatically, so the
# documentation reorganisation can move pages without touching this file.
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
