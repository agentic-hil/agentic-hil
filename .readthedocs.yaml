# Read the Docs build configuration.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
#
# The documentation is published at https://agentic-hil.github.io/docs/ and is
# no longer built here. This build replaces every page the old address served
# with a notice at the same path that points at the page that replaced it: see
# tools/readthedocs_moved.py and "The Documentation Site" in
# docs/release-strategy.md. No MkDocs or Sphinx key, so Read the Docs installs
# nothing and runs only the job below.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - python tools/readthedocs_moved.py "$READTHEDOCS_OUTPUT/html"
