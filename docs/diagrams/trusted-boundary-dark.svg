<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="430" viewBox="0 0 1060 430" role="img" aria-label="The agent-writable project workspace reaches Agentic HIL only over MCP stdio. The authoritative config, the state_root holding leases, quarantine and the SHA-256 audit chain, and the hardware itself all sit on the operator-controlled host outside the workspace.">
  <title>The trusted policy boundary</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .t { font-size: 15px; font-weight: 600; }
    .d { font-size: 13px; fill: #8b949e; }
    .text { fill: #e6edf3; }
    .acc_text { fill: #cae8ff; }
    .warn_text { fill: #f2cc60; }
    .danger_text { fill: #ffdcd7; }
    .plain { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .accent { fill: #0d2847; stroke: #1f6feb; stroke-width: 1.75; }
    .warn { fill: #2d2410; stroke: #d29922; stroke-width: 1.75; }
    .danger { fill: #2b1214; stroke: #f85149; stroke-width: 1.75; }
    .edge { fill: none; stroke: #8b949e; stroke-width: 1.75; marker-end: url(#head); }
    .wire { fill: none; stroke: #58a6ff; stroke-width: 1.75; marker-end: url(#head-accent); }
    .nohead { marker-end: none; }
    .cluster { fill: none; stroke: #30363d; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .cluster-label { font-size: 13px; fill: #8b949e; text-anchor: start; }
    .chip { fill: #0d1117; stroke: none; }
    .chip-label { font-size: 13px; fill: #8b949e; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
    <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect class="cluster" x="16" y="182" width="210" height="114" rx="12"/>
  <text class="cluster-label" x="32" y="206">project workspace (agent-writable)</text>
  <rect class="cluster" x="700" y="16" width="344" height="392" rx="12"/>
  <text class="cluster-label" x="716" y="40">operator-controlled host, outside the workspace</text>
  <rect class="plain" x="36" y="213" width="170" height="52" rx="8"/>
  <text><tspan x="121" y="244" class="t text">AI agent / CI</tspan></text>
  <rect class="accent" x="336" y="213" width="170" height="52" rx="8"/>
  <text><tspan x="421" y="244" class="t acc_text">Agentic HIL</tspan></text>
  <rect class="plain" x="724" y="60.5" width="296" height="103" rx="8"/>
  <text><tspan x="872" y="91.5" class="t text">authoritative config</tspan><tspan x="872" y="111.5" class="d">deny-by-default permissions,</tspan><tspan x="872" y="128.5" class="d">pinned executables,</tspan><tspan x="872" y="145.5" class="d">bound to workspace_root</tspan></text>
  <rect class="plain" x="724" y="196" width="296" height="86" rx="8"/>
  <text><tspan x="872" y="227" class="t text">state_root</tspan><tspan x="872" y="247" class="d">owner leases · quarantine ·</tspan><tspan x="872" y="264" class="d">SHA-256 audit chain</tspan></text>
  <rect class="plain" x="724" y="322" width="296" height="52" rx="8"/>
  <text><tspan x="872" y="353" class="t text">debug probe · serial · CAN</tspan></text>
  <path class="edge" d="M212.0 239.0 L330.0 239.0"/>
  <rect class="chip" x="227.2" y="229" width="87.7" height="20" rx="4"/>
  <text class="chip-label" x="271" y="243.5">MCP (stdio)</text>
  <path class="edge" d="M511.4 225.4 L718.6 126.6"/>
  <rect class="chip" x="564.5" y="166" width="101.1" height="20" rx="4"/>
  <text class="chip-label" x="615" y="180.5">policy lookup</text>
  <path class="edge" d="M512.0 239.0 L718.0 239.0"/>
  <rect class="chip" x="527.6" y="229" width="174.8" height="20" rx="4"/>
  <text class="chip-label" x="615" y="243.5">leases + canonical audit</text>
  <path class="wire" d="M511.6 252.2 L718.4 333.8"/>
  <rect class="chip" x="510.9" y="283" width="208.3" height="20" rx="4"/>
  <text class="chip-label" x="615" y="297.5">validated, time-boxed actions</text>
</svg>
