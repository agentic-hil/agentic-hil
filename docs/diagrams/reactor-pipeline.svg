<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img" aria-label="A test plan goes through preflight, where every step is validated and no hardware is touched. Any finding rejects the whole plan with zero steps executed. Only when all steps are valid does execution run, sequential and fail-fast, followed by guaranteed cleanup and a structured report.">
  <title>The test reactor pipeline</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .t { font-size: 15px; font-weight: 600; }
    .d { font-size: 13px; fill: #656d76; }
    .text { fill: #1f2328; }
    .acc_text { fill: #0a3069; }
    .warn_text { fill: #5c4813; }
    .danger_text { fill: #82071e; }
    .plain { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
    .warn { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.75; }
    .danger { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.75; }
    .edge { fill: none; stroke: #656d76; stroke-width: 1.75; marker-end: url(#head); }
    .wire { fill: none; stroke: #0969da; stroke-width: 1.75; marker-end: url(#head-accent); }
    .nohead { marker-end: none; }
    .cluster { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .cluster-label { font-size: 13px; fill: #656d76; text-anchor: start; }
    .chip { fill: #ffffff; stroke: none; }
    .chip-label { font-size: 13px; fill: #656d76; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656d76"/>
    </marker>
    <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0969da"/>
    </marker>
  </defs>
  <rect class="plain" x="24" y="145.5" width="170" height="69" rx="8"/>
  <text><tspan x="109" y="176.5" class="t text">test plan</tspan><tspan x="109" y="196.5" class="d">(YAML / JSON)</tspan></text>
  <rect class="accent" x="242" y="137" width="230" height="86" rx="8"/>
  <text><tspan x="357" y="168" class="t acc_text">preflight</tspan><tspan x="357" y="188" class="d">every step validated,</tspan><tspan x="357" y="205" class="d">no hardware touched</tspan></text>
  <rect class="warn" x="600" y="35.5" width="250" height="69" rx="8"/>
  <text><tspan x="725" y="66.5" class="t warn_text">rejected:</tspan><tspan x="725" y="86.5" class="d">zero steps executed</tspan></text>
  <rect class="plain" x="24" y="275.5" width="230" height="69" rx="8"/>
  <text><tspan x="139" y="306.5" class="t text">sequential execution</tspan><tspan x="139" y="326.5" class="d">fail-fast</tspan></text>
  <rect class="plain" x="302" y="267" width="250" height="86" rx="8"/>
  <text><tspan x="427" y="298" class="t text">guaranteed cleanup</tspan><tspan x="427" y="318" class="d">breakpoints removed,</tspan><tspan x="427" y="335" class="d">sessions closed</tspan></text>
  <rect class="plain" x="600" y="275.5" width="210" height="69" rx="8"/>
  <text><tspan x="705" y="306.5" class="t text">structured report</tspan><tspan x="705" y="326.5" class="d">+ canonical audit</tspan></text>
  <path class="edge" d="M200.0 180.0 L236.0 180.0"/>
  <path class="edge" d="M477.1 158.9 L594.9 87.1"/>
  <rect class="chip" x="492.1" y="113" width="87.7" height="20" rx="4"/>
  <text class="chip-label" x="536" y="127.5">any finding</text>
  <path class="edge" d="M357 223 V235 Q357 250 342 250 H154 Q139 250 139 265 V269.5"/>
  <rect class="chip" x="190.8" y="240" width="114.5" height="20" rx="4"/>
  <text class="chip-label" x="248" y="254.5">all steps valid</text>
  <path class="edge" d="M260.0 310.0 L296.0 310.0"/>
  <path class="edge" d="M558.0 310.0 L594.0 310.0"/>
</svg>
