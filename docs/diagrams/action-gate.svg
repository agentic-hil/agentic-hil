<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-label="Every tool call passes a deny-by-default permission gate, then validation, then a cross-process owner lease, before executing with a pinned executable and a timeout. Success appends to the SHA-256 audit chain and returns a structured JSON result; a crash or unknown effect quarantines the resource until an operator recovers it.">
  <title>The action gate</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .t { font-size: 15px; font-weight: 600; }
    .d { font-size: 13px; fill: #656d76; }
    .text { fill: #1f2328; }
    .acc_text { fill: #0a3069; }
    .warn_text { fill: #5c4813; }
    .danger_text { fill: #82071e; }
    .plain { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.75; }
    .warn { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.75; }
    .danger { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.75; }
    .edge { fill: none; stroke: #656d76; stroke-width: 1.75; marker-end: url(#head); }
    .wire { fill: none; stroke: #0969da; stroke-width: 1.75; marker-end: url(#head-accent); }
    .nohead { marker-end: none; }
    .cluster { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .cluster-label { font-size: 13px; fill: #656d76; text-anchor: start; }
    .chip { fill: #ffffff; stroke: none; }
    .chip-label { font-size: 13px; fill: #656d76; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#656d76"/>
    </marker>
    <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0969da"/>
    </marker>
  </defs>
  <rect class="plain" x="24" y="54" width="140" height="52" rx="8"/>
  <text><tspan x="94" y="85" class="t text">tool call</tspan></text>
  <rect class="accent" x="212" y="45.5" width="196" height="69" rx="8"/>
  <text><tspan x="310" y="76.5" class="t acc_text">permission gate</tspan><tspan x="310" y="96.5" class="d">deny-by-default</tspan></text>
  <rect class="plain" x="456" y="45.5" width="224" height="69" rx="8"/>
  <text><tspan x="568" y="76.5" class="t text">validate</tspan><tspan x="568" y="96.5" class="d">paths · artifacts · sizes</tspan></text>
  <rect class="plain" x="728" y="45.5" width="208" height="69" rx="8"/>
  <text><tspan x="832" y="76.5" class="t text">acquire owner lease</tspan><tspan x="832" y="96.5" class="d">cross-process</tspan></text>
  <rect class="plain" x="84" y="215.5" width="256" height="69" rx="8"/>
  <text><tspan x="212" y="246.5" class="t text">execute</tspan><tspan x="212" y="266.5" class="d">pinned executable, timeout</tspan></text>
  <rect class="plain" x="388" y="215.5" width="224" height="69" rx="8"/>
  <text><tspan x="500" y="246.5" class="t text">append to</tspan><tspan x="500" y="266.5" class="d">SHA-256 audit chain</tspan></text>
  <rect class="plain" x="660" y="224" width="216" height="52" rx="8"/>
  <text><tspan x="768" y="255" class="t text">structured JSON result</tspan></text>
  <rect class="danger" x="68" y="355.5" width="288" height="69" rx="8"/>
  <text><tspan x="212" y="386.5" class="t danger_text">quarantine:</tspan><tspan x="212" y="406.5" class="d">operator recovery required</tspan></text>
  <path class="edge" d="M170.0 80.0 L206.0 80.0"/>
  <path class="edge" d="M414.0 80.0 L450.0 80.0"/>
  <path class="edge" d="M686.0 80.0 L722.0 80.0"/>
  <path class="edge" d="M832 114.5 V150 Q832 165 817 165 H227 Q212 165 212 180 V209.5"/>
  <path class="edge" d="M346.0 250.0 L382.0 250.0"/>
  <path class="edge" d="M618.0 250.0 L654.0 250.0"/>
  <path class="edge" d="M212.0 290.5 L212.0 349.5"/>
  <rect class="chip" x="131.3" y="310" width="161.4" height="20" rx="4"/>
  <text class="chip-label" x="212" y="324.5">crash / unknown effect</text>
</svg>
